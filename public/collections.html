<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Resource Hints -->
    <link rel="preload" href="assets/css/variables.css" as="style">
    <link rel="preload" href="assets/css/skeletons.css" as="style">
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="assets/js/load-header-standard.js" as="script">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Lebanon Locals Collections</title>
    
    <!-- Favicon -->
    <link rel="icon" href="images/svgahmadLL.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/svgahmadLL.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/wishlist.css">
    <link rel="stylesheet" href="assets/css/skeletons.css">
</head>
<body class="collections-page">

    <!-- Unified Header -->
    <div id="header-placeholder"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-modals.js"></script>
    <script src="assets/js/load-header-standard.js"></script>
<main class="collections-main">
        <section class="collections-search">
            <div class="content-search-bar">
                <div class="search-bar-container">
                    <div class="search-field-group">
                        <label id="label-location">Location</label>
                        <input id="input-location" type="text" placeholder="Where are you going?" />
                    </div>
                    <div class="search-divider"></div>
                    <div class="search-field-group date-field-wrapper">
                        <label id="label-date-start">Date from</label>
                        <input id="input-date-start" type="date" class="date-input" />
                        <span class="date-placeholder">Add date</span>
                    </div>
                    <div class="search-divider"></div>
                    <div class="search-field-group date-field-wrapper">
                        <label id="label-date-end">Date to</label>
                        <input id="input-date-end" type="date" class="date-input" />
                        <span class="date-placeholder">Add date</span>
                    </div>
                    <div class="search-divider"></div>
                    <div class="search-field-group">
                        <label id="label-guests">Guests</label>
                        <input id="input-guests" type="number" placeholder="Add guests" min="1" />
                    </div>
                    <button class="search-action-btn" type="button">
                        <i class="fa fa-search"></i>
                        <span>Search</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Subtypes Navigation -->
        <div class="collections-subtypes" id="collectionsSubtypes">
            <!-- Subtypes will be loaded here -->
        </div>

        <section class="collections-summary">
            <div class="summary-primary">
                <h1 id="collectionsTitle">Collections</h1>
                <p id="collectionsSubtitle">Loading results...</p>
            </div>
            <div class="summary-actions">
                <div class="summary-filters" id="collectionsFilters"></div>
                <div class="summary-buttons">
                    <div class="sort-select-wrapper" id="sortSelectWrapper">
                        <select id="sortSelect" class="sort-select" aria-label="Sort results">
                            <option value="random">Randomize</option>
                            <option value="rating_high">Rating: High to Low</option>
                            <option value="rating_low">Rating: Low to High</option>
                            <option value="price_high">Price: High to Low</option>
                            <option value="price_low">Price: Low to High</option>
                        </select>
                        <i class="fa fa-chevron-down sort-arrow"></i>
                    </div>
                    <button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search criteria">
                        <i class="fa fa-times-circle"></i>
                        <span>Clear Search</span>
                    </button>
                    <button type="button" id="filtersToggleBtn" class="filters-toggle-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="collectionsFiltersPanel">
                        <i class="fa fa-sliders"></i>
                        <span>Filters</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="collections-filters-panel" id="collectionsFiltersPanel" role="dialog" aria-modal="true" aria-hidden="true">
            <form id="collectionsFiltersForm" class="filters-form">
                <div class="filters-header">
                    <h2>Filters</h2>
                    <div class="filters-actions">
                        <button type="button" id="filtersResetBtn" class="filters-reset">Reset</button>
                        <button type="button" id="filtersApplyBtn" class="filters-apply">Apply</button>
                    </div>
                </div>

                <div class="filters-grid">
                    <div class="filter-block" data-visible-for="experience,event,stay">
                        <h3>Price</h3>
                        <div class="filter-range">
                            <div class="filter-range-inputs">
                                <input type="range" id="filter-price-min-range" min="0" max="10000" step="10" aria-label="Minimum price">
                                <input type="range" id="filter-price-max-range" min="0" max="10000" step="10" aria-label="Maximum price">
                            </div>
                            <div class="filter-number-inputs">
                                <label for="filter-price-min-input">Min</label>
                                <input type="number" id="filter-price-min-input" min="0" max="10000" step="10">
                                <label for="filter-price-max-input">Max</label>
                                <input type="number" id="filter-price-max-input" min="0" max="10000" step="10">
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>Bedrooms</h3>
                        <div class="filter-duration-inputs">
                            <div class="duration-input-group">
                                <label for="filter-bedrooms-min">Minimum bedrooms</label>
                                <input type="number" id="filter-bedrooms-min" min="0" step="1" placeholder="Any">
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>Beds</h3>
                        <div class="filter-bed-inputs">
                            <div class="bed-count-group">
                                <label for="filter-beds-min">Total beds</label>
                                <input type="number" id="filter-beds-min" min="0" step="1" placeholder="Any">
                            </div>
                            <div class="bed-count-group">
                                <label for="filter-double-beds-min">Double beds</label>
                                <input type="number" id="filter-double-beds-min" min="0" step="1" placeholder="Any">
                            </div>
                            <div class="bed-count-group">
                                <label for="filter-single-beds-min">Single beds</label>
                                <input type="number" id="filter-single-beds-min" min="0" step="1" placeholder="Any">
                                <label class="single-bed-note">
                                    <input type="checkbox" id="filter-single-include-couch">
                                    <span>Include couch-beds</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>Bathrooms</h3>
                        <div class="filter-duration-inputs">
                            <div class="duration-input-group">
                                <label for="filter-bathrooms-min">Minimum bathrooms</label>
                                <input type="number" id="filter-bathrooms-min" min="0" step="0.5" placeholder="Any">
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="experience,event">
                        <h3>Duration (hours)</h3>
                        <div class="filter-duration-inputs">
                            <div class="duration-input-group">
                                <label for="filter-length-min-input">Min</label>
                                <input type="number" id="filter-length-min-input" min="0" max="24" step="0.5" placeholder="Any">
                            </div>
                            <div class="duration-input-group">
                                <label for="filter-length-max-input">Max</label>
                                <input type="number" id="filter-length-max-input" min="0" max="24" step="0.5" placeholder="Any">
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="experience">
                        <h3>Start &amp; End Time</h3>
                        <div class="filter-time-inputs">
                            <div class="time-input-group">
                                <label for="filter-hour-start">Start after</label>
                                <select id="filter-hour-start" class="time-select"></select>
                            </div>
                            <div class="time-input-group">
                                <label for="filter-hour-end">End before</label>
                                <select id="filter-hour-end" class="time-select"></select>
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="experience,event">
                        <h3>Difficulty</h3>
                        <div class="filter-checkbox-grid" id="filter-difficulty-options"></div>
                    </div>

                    <div class="filter-block" data-visible-for="experience,event">
                        <h3>Age Range</h3>
                        <div class="filter-age-inputs">
                            <div class="age-input-group">
                                <label for="filter-min-age">Minimum age</label>
                                <input type="number" id="filter-min-age" min="0" max="120">
                            </div>
                            <div class="age-input-group">
                                <label for="filter-max-age">Maximum age</label>
                                <input type="number" id="filter-max-age" min="0" max="120">
                            </div>
                        </div>
                    </div>

                    <div class="filter-block" data-visible-for="experience,event,stay">
                        <h3>Cancellation policy</h3>
                        <div class="filter-checkbox-grid" id="filter-cancellation-options"></div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>Property type</h3>
                        <div class="filter-checkbox-grid" id="filter-property-type-options"></div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>House rules</h3>
                        <div class="filter-checkbox-grid" id="filter-house-rules"></div>
                    </div>

                    <div class="filter-block" data-visible-for="stay">
                        <h3>Amenities</h3>
                        <div class="filter-checkbox-grid" id="filter-amenities-options"></div>
                    </div>
                </div>
            </form>
        </section>

        <div class="filters-backdrop" id="filtersBackdrop" aria-hidden="true"></div>

        <!-- For events: week-grouped container -->
        <section class="event-week-groups" id="events-groups" style="display: none;">
            <p class="collections-loading">Loading events...</p>
        </section>

        <!-- For experiences/stays: grid container -->
        <section class="collections-results" id="collectionsResults">
            <p class="collections-loading">Loading results...</p>
        </section>
        
        <!-- Pagination -->
        <div class="pagination-container" id="paginationContainer" style="display: none;">
            <button class="pagination-btn" id="prevPageBtn" disabled>
                <i class="fa fa-chevron-left"></i> Previous
            </button>
            <span class="pagination-info" id="paginationInfo">Page 1 of 1</span>
            <button class="pagination-btn" id="nextPageBtn" disabled>
                Next <i class="fa fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js"></script>

    <!-- Auth modals are loaded via includes/auth-modals.html in the header script below -->
    <!-- No duplicate modals needed here -->

    <script src="assets/js/api.js"></script>
    <script src="assets/js/wishlist.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/collections.js"></script>
</body>
</html>
