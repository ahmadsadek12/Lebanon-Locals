<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==================== META TAGS ==================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Resource Hints -->
    <link rel="preload" href="assets/css/variables.css" as="style">
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="assets/js/config.js" as="script">
    <link rel="preload" href="assets/js/load-header-standard.js" as="script">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <title>My Wishlist - Lebanon Locals</title>
    <meta name="description" content="View your saved experiences, events, and stays in Lebanon">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.lebanonlocals.com/wishlist.html">

    <!-- Favicon -->
    <link rel="icon" href="images/svgahmadLL.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/svgahmadLL.svg">

    <!-- ==================== FONTS ==================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

    <!-- ==================== STYLESHEETS ==================== -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/wishlist.css">
    
    <!-- Wishlist Page Specific Styles -->
    <style>
        /* Show header on wishlist page */
        .main-header {
            display: block !important;
        }
        
        /* Ensure wishlist page has proper spacing */
        .wishlist-main {
            padding-top: 20px;
        }
        
        /* OVERRIDE wishlist card image styles to show images properly */
        .wishlist-card-image {
            position: relative !important;
            width: 100% !important;
            height: 280px !important;
            padding-top: 0 !important; /* Override the padding-top from wishlist.css */
            overflow: hidden !important;
            border-radius: 12px !important;
            background: #f7f7f7 !important;
        }
        
        .wishlist-card-image img {
            position: relative !important; /* Override absolute positioning */
            top: auto !important;
            left: auto !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
            transition: transform 0.3s ease !important;
        }
        
        .wishlist-card:hover .wishlist-card-image img {
            transform: scale(1.05) !important;
        }
        
        .wishlist-card-type {
            position: absolute !important;
            bottom: 12px !important;
            left: 12px !important;
            background: rgba(255, 255, 255, 0.95) !important;
            padding: 6px 12px !important;
            border-radius: 6px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            text-transform: capitalize !important;
            color: #222 !important;
            z-index: 2 !important;
        }
        
        /* Wishlist card heart button */
        .wishlist-card-heart {
            position: absolute !important;
            top: 12px !important;
            right: 12px !important;
            z-index: 3 !important;
        }
        
        /* Make sure wishlist cards display properly */
        .wishlist-card {
            position: relative !important;
        }
        
        /* Debug: highlight image container */
        .wishlist-card-image {
            border: 2px solid #ddd;
        }
    </style>
</head>
<body class="wishlist-page">
    <!-- Unified Header -->
    <div id="header-placeholder"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-modals.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/load-header-standard.js"></script>

    <!-- Main Content -->
    <main class="wishlist-main">
        <div class="wishlist-container">
            <!-- Page Header -->
            <div class="wishlist-header">
                <h1>Wishlist</h1>
            </div>

            <!-- Filter Tabs -->
            <div class="wishlist-filters">
                <button class="filter-tab active" data-filter="all">
                    All (<span id="count-all">0</span>)
                </button>
                <button class="filter-tab" data-filter="experience">
                    Experiences (<span id="count-experience">0</span>)
                </button>
                <button class="filter-tab" data-filter="event">
                    Events (<span id="count-event">0</span>)
                </button>
                <button class="filter-tab" data-filter="stay">
                    Stays (<span id="count-stay">0</span>)
                </button>
            </div>

            <!-- Empty State -->
            <div id="wishlist-empty" class="wishlist-empty" style="display: none;">
                <i class="fa fa-heart-o"></i>
                <h2>Your wishlist is empty</h2>
                <p>Start adding your favorite experiences, events, and stays to your wishlist</p>
                <a href="index.html" class="btn-primary">Explore Lebanon</a>
            </div>

            <!-- Loading State -->
            <div id="wishlist-loading" class="wishlist-loading">
                <div class="loading-spinner"></div>
                <p>Loading your wishlist...</p>
            </div>

            <!-- Wishlist Grid -->
            <div id="wishlist-grid" class="wishlist-grid" style="display: none;">
                <!-- Items will be populated here -->
            </div>

            <!-- Load More Button -->
            <div style="text-align: center; margin: 40px 0;">
                <button id="wishlist-load-more" class="btn-load-more" style="display: none;">
                    Load More
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js"></script>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="js/jquery-3.5.0.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <script src="assets/js/config.js"></script>
    
    <script src="assets/js/wishlist.js"></script>
</body>
</html>
