<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==================== META TAGS ==================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Resource Hints -->
    <link rel="preload" href="assets/css/variables.css" as="style">
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="assets/js/config.js" as="script">
    <link rel="preload" href="assets/js/load-header-standard.js" as="script">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <title>Reviews - Lebanon Locals</title>
    <meta name="description" content="Read guest reviews and ratings for experiences, events, and stays in Lebanon">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.lebanonlocals.com/reviews.html">

    <!-- Favicon -->
    <link rel="icon" href="images/logos/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logos/favicon.png">

    <!-- ==================== FONTS ==================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

    <!-- ==================== STYLESHEETS ==================== -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="assets/css/reviews.css">
</head>
<body class="hide-nav-words">
    <!-- Unified Header -->
    <div id="header-placeholder"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-modals.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/load-header-standard.js"></script>

<!-- Sticky Header -->
    <header class="reviews-header" id="reviewsHeader">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="images/logos/logo.jpg" alt="Lebanon Locals" class="logo-img">
            </a>

            <div class="header-nav">
                <button class="host-btn" onclick="alert('Become a host feature coming soon!')">Become a Host</button>
                <div class="menu-btn" onclick="alert('Sign up / Log in coming soon!')">
                    <i class="fa fa-bars"></i>
                    <div class="user-icon">
                        <i class="fa fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Loading State -->
    <div id="loading-state" class="reviews-loading">
        <div class="loading-spinner"></div>
        <p>Loading reviews...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="reviews-error" style="display: none;">
        <div class="error-container">
            <i class="fa fa-exclamation-triangle"></i>
            <h2>Oops! Something went wrong</h2>
            <p id="error-message">Unable to load reviews. Please try again.</p>
            <a href="javascript:history.back()" class="btn-primary">Go Back</a>
        </div>
    </div>

    <!-- Reviews Content -->
    <main id="reviews-content" class="reviews-main" style="display: none;">
        <div class="reviews-container">
            <!-- Back Button -->
            <div class="back-section">
                <a href="javascript:history.back()" class="back-btn">
                    <i class="fa fa-arrow-left"></i> Back to listing
                </a>
            </div>

            <!-- Header Section -->
            <div class="reviews-header-section">
                <h1 id="reviews-title">Reviews</h1>
                <div class="reviews-summary-bar">
                    <div class="summary-rating">
                        <div class="rating-number" id="average-rating">0.0</div>
                        <div class="rating-stars" id="rating-stars"></div>
                        <div class="rating-count" id="total-reviews">0 reviews</div>
                    </div>
                </div>
            </div>

            <!-- Rating Breakdown -->
            <div class="rating-breakdown-section" id="rating-breakdown">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Filters -->
            <div class="reviews-filters">
                <button class="filter-btn active" data-filter="all">
                    All reviews
                </button>
                <button class="filter-btn" data-filter="recent">
                    Most recent
                </button>
                <button class="filter-btn" data-filter="highest">
                    Highest rated
                </button>
                <button class="filter-btn" data-filter="lowest">
                    Lowest rated
                </button>
                <button class="filter-btn" data-filter="with-response">
                    With host response
                </button>
            </div>

            <!-- Reviews List -->
            <div class="reviews-list" id="reviews-list">
                <!-- Reviews will be populated here by JavaScript -->
            </div>

            <!-- Load More -->
            <div class="load-more-section" id="load-more-section" style="display: none;">
                <button class="btn-load-more" id="load-more-btn">
                    Load more reviews
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js"></script>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="js/jquery-3.5.0.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/host-reviews.js"></script>
</body>
</html>
