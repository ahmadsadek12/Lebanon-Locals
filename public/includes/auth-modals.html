<!-- ==================== AUTH MODALS ==================== -->
<!-- Note: Login and signup are now separate pages (login.html, signup.html) -->
<!-- Only User Menu Modal is kept here for logged-in users -->

<!-- User Menu Modal -->
<div id="user-menu-modal" class="modal">
    <div class="modal-content user-menu-content">
        <span class="modal-close">&times;</span>

        <!-- User Menu Tabs -->
        <div class="user-menu-tabs">
            <button class="tab-btn active" data-tab="upcoming">
                Upcoming Bookings <span id="upcoming-count" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-tab="previous">
                Previous Bookings <span id="previous-count" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-tab="cancelled">
                Cancelled <span id="cancelled-count" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-tab="pending">
                Pending <span id="pending-count" class="tab-count">0</span>
            </button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content active" id="tab-upcoming">
            <div id="upcoming-bookings-list" class="bookings-list">
                <!-- Bookings will be loaded here -->
            </div>
        </div>

        <div class="tab-content" id="tab-previous">
            <div id="previous-bookings-list" class="bookings-list">
                <!-- Previous bookings will be loaded here -->
            </div>
        </div>

        <div class="tab-content" id="tab-cancelled">
            <div id="cancelled-bookings-list" class="bookings-list">
                <!-- Cancelled bookings will be loaded here -->
            </div>
        </div>

        <div class="tab-content" id="tab-pending">
            <div id="pending-bookings-list" class="bookings-list">
                <!-- Pending bookings will be loaded here -->
            </div>
        </div>

        <!-- User Profile Footer -->
        <div class="user-menu-footer">
            <div class="user-profile-info" id="user-profile-link" style="cursor: pointer;" title="View my profile">
                <div class="user-avatar" id="user-menu-avatar"></div>
                <span id="user-menu-name">User Name</span>
            </div>
            <button id="logout-btn" class="btn-logout">
                <i class="fa fa-sign-out"></i> Logout
            </button>
        </div>
    </div>
</div>
