<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Lebanon Locals Admin</title>
    <link rel="icon" href="../public/images/svgahmadLL.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-page">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-logo">
            <img src="../public/images/logos/logo.jpg" alt="Lebanon Locals">
            <h2>Admin Panel</h2>
        </div>

        <nav>
            <ul class="admin-nav">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fa fa-dashboard"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="users.html" class="nav-link active">
                        <i class="fa fa-users"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a href="bookings.html" class="nav-link">
                        <i class="fa fa-calendar"></i> Bookings
                    </a>
                </li>
                <li class="nav-item">
                    <a href="experiences.html" class="nav-link">
                        <i class="fa fa-star"></i> Experiences
                    </a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link">
                        <i class="fa fa-calendar-check-o"></i> Events
                    </a>
                </li>
                <li class="nav-item">
                    <a href="stays.html" class="nav-link">
                        <i class="fa fa-home"></i> Stays
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reviews.html" class="nav-link">
                        <i class="fa fa-comment"></i> Reviews
                    </a>
                </li>
                <li class="nav-item">
                    <a href="amenities.html" class="nav-link">
                        <i class="fa fa-cube"></i> Amenities
                    </a>
                </li>
                <li class="nav-item">
                    <a href="subtypes.html" class="nav-link">
                        <i class="fa fa-tags"></i> Subtypes
                    </a>
                </li>
                <li class="nav-item">
                    <a href="messages.html" class="nav-link">
                        <i class="fa fa-envelope"></i> Messages
                    </a>
                </li>
                <li class="nav-item">
                    <a href="notifications.html" class="nav-link">
                        <i class="fa fa-bell"></i> Notifications
                    </a>
                </li>
                <li class="nav-item">
                    <a href="payments.html" class="nav-link">
                        <i class="fa fa-dollar"></i> Payments
                    </a>
                </li>
                <li class="nav-item">
                    <a href="verifications.html" class="nav-link">
                        <i class="fa fa-check-circle"></i> Verifications
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <h1>User Management</h1>
            <div class="admin-user">
                <div class="admin-user-avatar" id="admin-avatar">A</div>
                <span id="admin-name">Admin</span>
                <button class="btn-logout" onclick="window.AdminAuth.logoutAdmin()">
                    <i class="fa fa-sign-out"></i> Logout
                </button>
            </div>
        </div>

        <!-- Users Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>All Users</h2>
                <div class="table-actions">
                    <input type="search" id="search-users" placeholder="Search users..." style="padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                    <button class="btn btn-add" onclick="openAddUserModal()">
                        <i class="fa fa-plus"></i> Add User
                    </button>
                </div>
            </div>
            <div id="users-table">
                <div class="loading">
                    <i class="fa fa-spinner fa-spin" style="font-size: 32px;"></i>
                    <p>Loading users...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit User Modal -->
    <div id="edit-user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Edit User</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="edit-user-form">
                <input type="hidden" id="user-id">
                
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" required>
                </div>

                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" required>
                </div>

                <div class="form-group">
                    <label for="user-type">User Type</label>
                    <select id="user-type" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                        <option value="customer">Customer</option>
                        <option value="host">Host</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-verified">Verified</label>
                    <select id="user-verified" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
                    <button type="button" class="btn btn-view" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/users.js"></script>
</body>
</html>
