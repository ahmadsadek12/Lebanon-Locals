<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Lebanon Locals Admin</title>
    <link rel="icon" href="../public/images/svgahmadLL.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-page">
    <aside class="admin-sidebar">
        <div class="admin-logo">
            <img src="../public/images/logos/logo.jpg" alt="Lebanon Locals">
            <h2>Admin Panel</h2>
        </div>
        <nav>
            <ul class="admin-nav">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                <li class="nav-item"><a href="users.html" class="nav-link"><i class="fa fa-users"></i> Users</a></li>
                <li class="nav-item"><a href="bookings.html" class="nav-link"><i class="fa fa-calendar"></i> Bookings</a></li>
                <li class="nav-item"><a href="experiences.html" class="nav-link"><i class="fa fa-star"></i> Experiences</a></li>
                <li class="nav-item"><a href="events.html" class="nav-link"><i class="fa fa-calendar-check-o"></i> Events</a></li>
                <li class="nav-item"><a href="stays.html" class="nav-link"><i class="fa fa-home"></i> Stays</a></li>
                <li class="nav-item"><a href="reviews.html" class="nav-link"><i class="fa fa-comment"></i> Reviews</a></li>
                <li class="nav-item"><a href="amenities.html" class="nav-link"><i class="fa fa-cube"></i> Amenities</a></li>
                <li class="nav-item"><a href="subtypes.html" class="nav-link"><i class="fa fa-tags"></i> Subtypes</a></li>
                <li class="nav-item"><a href="messages.html" class="nav-link active"><i class="fa fa-envelope"></i> Messages</a></li>
                <li class="nav-item"><a href="notifications.html" class="nav-link"><i class="fa fa-bell"></i> Notifications</a></li>
                <li class="nav-item"><a href="payments.html" class="nav-link"><i class="fa fa-dollar"></i> Payments</a></li>
                <li class="nav-item"><a href="verifications.html" class="nav-link"><i class="fa fa-check-circle"></i> Verifications</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="admin-header">
            <h1>Messages</h1>
            <div class="admin-user">
                <div class="admin-user-avatar" id="admin-avatar">A</div>
                <span id="admin-name">Admin</span>
                <button class="btn-logout" onclick="window.AdminAuth.logoutAdmin()"><i class="fa fa-sign-out"></i> Logout</button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>All Messages</h2>
                <div class="table-actions">
                    <select id="filter-read" style="padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                        <option value="">All</option>
                        <option value="0">Unread</option>
                        <option value="1">Read</option>
                    </select>
                    <input type="search" id="search-messages" placeholder="Search..." style="padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                </div>
            </div>
            <div id="messages-table">
                <div class="loading"><i class="fa fa-spinner fa-spin" style="font-size: 32px;"></i><p>Loading messages...</p></div>
            </div>
        </div>
    </main>

    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/messages-admin.js"></script>
</body>
</html>
